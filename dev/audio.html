<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소리 실험실</title>
<link rel="icon" href="../icons/icon.svg">
<style>
:root {
  --bg: #FBF7EE; --card: #FFFFFF; --ink: #2B2118; --muted: #7A6A58; --line: #E9DFCC; --soft: #F5EDDF;
  --btn: #FFFDF8; --btn-hover: #FFF3DC; --ok: #1F7A3F; --bad: #B3261E; --wave-bg: #FCFAF5;
  --red: #E14B2F; --blue: #2C5ED0; --yellow: #D99A12; --teal: #13A597; --plum: #8A4FB8; --brown: #9A6A3A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1611; --card: #261F18; --ink: #F3EADB; --muted: #B6A690; --line: #3B3025; --soft: #2F271F;
    --btn: #2C241C; --btn-hover: #3A2F24; --ok: #5FD08A; --bad: #FF8A80; --wave-bg: #211B15;
    --red: #FF6A4D; --blue: #6E95FF; --yellow: #FFCB47; --teal: #2FCBB8; --plum: #C28BF0; --brown: #D9A56B;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1611; --card: #261F18; --ink: #F3EADB; --muted: #B6A690; --line: #3B3025; --soft: #2F271F;
  --btn: #2C241C; --btn-hover: #3A2F24; --ok: #5FD08A; --bad: #FF8A80; --wave-bg: #211B15;
  --red: #FF6A4D; --blue: #6E95FF; --yellow: #FFCB47; --teal: #2FCBB8; --plum: #C28BF0; --brown: #D9A56B;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
}
header.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
}
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.brand b { font-size: 20px; letter-spacing: -0.02em; white-space: nowrap; flex: none; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.on { background: color-mix(in srgb, var(--teal) 22%, var(--card)); color: var(--ink); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles label {
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 6px 10px; min-height: 36px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; user-select: none;
}
.toggles input { accent-color: var(--red); width: 16px; height: 16px; margin: 0; }
main { max-width: 1120px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px; margin: 0 0 14px; }
.card h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.card h2 .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--red)); flex: none; }
.card h2 small { font-weight: 500; color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
button.sb {
  font: inherit; color: var(--ink); background: var(--btn); border: 1.5px solid var(--line);
  border-left: 5px solid var(--c, var(--red)); border-radius: 12px; min-height: 56px; padding: 7px 10px;
  text-align: left; cursor: pointer; transition: background .12s, transform .08s;
}
button.sb:hover { background: var(--btn-hover); }
button.sb:active { transform: scale(0.97); }
button.sb:focus-visible, button.act:focus-visible, .toggles label:focus-within { outline: 3px solid color-mix(in srgb, var(--blue) 60%, transparent); outline-offset: 2px; }
button.sb b { display: block; font-size: 15px; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
button.sb small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; word-break: keep-all; overflow-wrap: anywhere; }
button.sb.hit { background: color-mix(in srgb, var(--c, var(--red)) 18%, var(--btn)); }
button.act {
  font: inherit; font-weight: 700; color: var(--ink); background: var(--soft); border: 1.5px solid var(--line);
  border-radius: 12px; min-height: 44px; padding: 8px 14px; cursor: pointer;
}
button.act:hover { background: var(--btn-hover); }
.scope-card { position: relative; }
#scope { display: block; width: 100%; height: 120px; border-radius: 12px 12px 0 0; background: var(--wave-bg); border: 1px solid var(--line); border-bottom: 0; }
#spec { display: block; width: 100%; height: 150px; border-radius: 0 0 12px 12px; background: #1B1611; }
.scope-info { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.scope-info b { color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.row input[type="text"] {
  font: inherit; color: var(--ink); background: var(--btn); border: 1.5px solid var(--line); border-radius: 12px;
  min-height: 44px; padding: 8px 12px; flex: 1 1 220px; min-width: 0;
}
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg label { padding: 8px 12px; font-size: 14px; cursor: pointer; background: var(--btn); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: color-mix(in srgb, var(--blue) 20%, var(--btn)); font-weight: 700; }
.voices { width: 100%; border-collapse: collapse; font-size: 14px; }
.voices th, .voices td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.voices th { color: var(--muted); font-weight: 600; }
.voices tr.ko td { background: color-mix(in srgb, var(--teal) 10%, transparent); }
.voices tr.best td { font-weight: 700; }
.table-wrap { overflow-x: auto; }
.note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.wave { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--wave-bg); }
.wave .t { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.wave .t span { font-weight: 500; color: var(--muted); font-size: 12px; }
.wave canvas { display: block; width: 100%; height: 52px; margin: 4px 0; }
.wave .m { font: 12px/1.3 ui-monospace, Menlo, monospace; color: var(--muted); }
.wave .m .bad { color: var(--bad); font-weight: 700; }
.wave .m .ok { color: var(--ok); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.checks span { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--soft); word-break: keep-all; }
.checks .ok { color: var(--ok); }
.checks .bad { color: var(--bad); font-weight: 700; }
#stats { display: none; }
#speaking { transition: background .2s; }
@media (max-width: 560px) {
  header.bar { position: static; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  button.sb { min-height: 52px; padding: 6px 8px; }
  .brand b { font-size: 18px; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <b>소리 실험실</b>
    <span class="pill" id="state">잠김 · 아무 곳이나 눌러요</span>
    <span class="pill" id="speaking">음성 쉬는 중</span>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="tSfx" checked> 효과음</label>
    <label><input type="checkbox" id="tMusic"> 굿거리 장단</label>
    <label><input type="checkbox" id="tTense"> 막판 긴장</label>
    <label><input type="checkbox" id="tVoice" checked> 읽어 주기</label>
    <label><input type="checkbox" id="tHaptic" checked> 진동</label>
  </div>
</header>

<main>
  <section class="card scope-card">
    <canvas id="scope" aria-label="마지막으로 누른 소리의 파형"></canvas>
    <canvas id="spec" aria-label="마지막으로 누른 소리의 스펙트로그램(세로: 80Hz~10kHz 로그 눈금)"></canvas>
    <div class="scope-info" id="scopeInfo"><span>버튼을 누르면 소리가 나고, 같은 소리를 따로 그려 파형을 보여 줘요.</span></div>
  </section>

  <section class="card" style="--c: var(--red)">
    <h2><span class="dot"></span>장면 <small>게임 속 순서대로 이어서</small></h2>
    <div class="grid" id="scenes"></div>
  </section>

  <div id="groups"></div>

  <section class="card" style="--c: var(--plum)">
    <h2><span class="dot"></span>배경 음악 · 진동</h2>
    <div class="row">
      <button class="act" id="mOn">장단 켜기</button>
      <button class="act" id="mOff">끄기</button>
      <button class="act" id="mTense">긴장 72↔90</button>
      <button class="act" id="mDuck">음성 흉내(3초 줄이기)</button>
      <button class="act" id="mShow">장단 파형 보기</button>
    </div>
    <div class="grid" id="buzz"></div>
    <p class="note">진동은 안드로이드 크롬에서만 느껴져요. iOS·데스크톱은 조용히 넘어갑니다.</p>
  </section>

  <section class="card" style="--c: var(--teal)">
    <h2><span class="dot"></span>읽어 주기 <small id="voiceInfo">목소리 찾는 중…</small></h2>
    <div class="row">
      <span class="seg" role="radiogroup" aria-label="우선순위">
        <label><input type="radio" name="prio" value="high"> 높음</label>
        <label><input type="radio" name="prio" value="normal" checked> 보통</label>
        <label><input type="radio" name="prio" value="low"> 낮음</label>
      </span>
      <button class="act" id="prioDemo">우선순위 시험</button>
    </div>
    <div class="grid" id="lines"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="custom" value="개! 복실이, 두 칸" aria-label="읽을 문장">
      <button class="act" id="sayBtn">읽기</button>
      <button class="act" id="hushBtn">멈춤</button>
    </div>
    <div class="table-wrap">
      <table class="voices" id="voices"><thead><tr><th></th><th>이름</th><th>언어</th><th>기기 안</th></tr></thead><tbody></tbody></table>
    </div>
  </section>

  <section class="card" style="--c: var(--yellow)">
    <h2><span class="dot"></span>파형 모음 <small>모든 소리를 따로 그려 최대값과 끝 소리 크기를 잰다</small></h2>
    <div class="row"><button class="act" id="galleryBtn">모두 그리기</button><span class="note" id="galleryNote"></span></div>
    <div class="checks" id="checks"></div>
    <div class="gallery" id="gallery"></div>
    <pre id="stats"></pre>
  </section>
</main>

<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
<script>
// 모듈을 읽다가 난 오류(js/audio.js·js/voice.js)도 제목에 보이도록, 모듈보다 먼저 건다
window.onerror = m => { document.title = 'ERR ' + m; };
window.addEventListener('unhandledrejection', e => { document.title = 'ERR ' + ((e.reason && e.reason.message) || e.reason); });
</script>
<script type="module">
import { createAudio, BUZZ, pent } from '../js/audio.js';
import { createVoice } from '../js/voice.js';
import { SPECIES } from '../js/theme.js';

const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');

const audio = createAudio();
const voice = createVoice({
  onSpeaking: b => {
    audio.duck(b);
    $('#speaking').textContent = b ? '음성 말하는 중 · 음악 30%' : '음성 쉬는 중';
    $('#speaking').classList.toggle('on', b);
  },
});

window.__lab = { audio, voice };

/* ---------- 소리 목록 ---------- */
const RN = { '-1': '빽도', 1: '도', 2: '개', 3: '걸', 4: '윷', 5: '모', nak: '낙' };
const RS = { '-1': '뒤로 뽀옹', 1: '덕덕', 2: '덕덕', 3: '덕덕', 4: '갠지갱', 5: '갠지갱×2 + 북', nak: '막음 + 아이고' };
const GUNG = ['궁', '상', '각', '치', '우'];
const C = ['var(--red)', 'var(--blue)', 'var(--yellow)', 'var(--teal)', 'var(--plum)', 'var(--brown)'];
const it = (name, params, label, sub) => ({ key: name + (Object.keys(params).length ? ':' + Object.values(params).join(',') : ''), name, params, label, sub });

const GROUPS = [
  { title: '던지기', sub: '멍석에 윷가락이 떨어질 때', c: C[1], items: [
    it('throwStart', {}, '던지기 시작', '덩 + 휙'),
    it('stickLand', { vol: 1 }, '윷가락 탁', 'vol 1'),
    it('stickLand', { vol: 0.4 }, '윷가락 톡', 'vol 0.4'),
    it('drumroll', { ms: 700 }, '북 드르륵', '0.7초'),
    it('drumroll', { ms: 1500 }, '긴 드르륵', '1.5초'),
    it('whoosh', {}, '휙', 'whoosh'),
  ] },
  { title: '윷 결과', sub: '도·개·걸 덕덕, 윷 갠지갱, 모 갠지갱×2+북', c: C[0], items:
    [-1, 1, 2, 3, 4, 5, 'nak'].map(r => it('result', { r }, RN[r], RS[r])) },
  { title: '한 칸씩', sub: '5음계(궁상각치우)로 올라가며 칸을 센다', c: C[3], items:
    Array.from({ length: 10 }, (_, s) => it('hop', { step: s }, `${s + 1}칸째`, `${GUNG[s % 5]} ${Math.round(pent(s % 5) * (s >= 5 ? 2 : 1))}Hz`)) },
  { title: '말 움직임', sub: '착지·업기·잡기·완주', c: C[2], items: [
    it('land', {}, '착지', 'land'),
    it('bigLand', {}, '쿵 착지', 'bigLand'),
    it('shortcut', {}, '지름길', 'shortcut'),
    it('stack', {}, '업기', '보잉'),
    it('capture', {}, '잡기', '북 + 휘파람'),
    it('backdo', {}, '뒷걸음', 'backdo'),
    it('finish', {}, '완주', '5음 상행'),
    it('teamDone', {}, '팀 완주', 'teamDone'),
    it('win', {}, '우승', '나팔 + 징'),
    it('turn', {}, '차례', '덩 기덕'),
  ] },
  { title: '동물 울음', sub: '설빔 입은 윷 동물 친구들', c: C[4], items:
    SPECIES.map(s => it('cry', { species: s.id }, `${s.animal} ${s.name}`, s.cry)) },
  { title: '잔치 칸', sub: '이벤트 칸에 멈췄을 때', c: C[5], items: [
    it('event', { kind: 'gift' }, '선물 상자', '짠!'),
    it('event', { kind: 'magpie' }, '까치', '깍깍, 한 번 더'),
    it('event', { kind: 'gate' }, '도깨비 문', '뚝딱! 순간이동'),
    it('event', { kind: 'puddle' }, '웅덩이', '퐁, 미끄덩'),
    it('event', { kind: 'friend' }, '친구 부르기', '여기~'),
    it('event', { kind: 'mission' }, '가족 미션', '덩 + 종'),
  ] },
  { title: '반응', sub: '버튼·고르기·축하', c: C[1], items: [
    it('tap', {}, '탭', 'tap'),
    it('select', {}, '고르기', 'select'),
    it('pop', {}, '뿅', 'pop'),
    it('clap', {}, '박수', 'clap'),
    it('bell', {}, '종', 'bell'),
    it('sparkle', {}, '반짝', 'sparkle'),
  ] },
];
const ALL = GROUPS.flatMap(g => g.items.map(x => ({ ...x, c: g.c })));

/** 소리마다 함께 줄 진동 */
function buzzFor(x) {
  if (x.name === 'result') return x.params.r === 4 || x.params.r === 5 ? 'yutmo' : null;
  return { capture: 'capture', stack: 'stack', finish: 'finish', teamDone: 'finish', win: 'win', land: 'land', bigLand: 'land', tap: 'tap', select: 'tap', stickLand: 'land' }[x.name] || null;
}

/* ---------- 버튼 만들기 ---------- */
function button(x, onClick) {
  const b = document.createElement('button');
  b.className = 'sb';
  b.style.setProperty('--c', x.c || C[0]);
  b.innerHTML = `<b></b><small></small>`;
  b.querySelector('b').textContent = x.label;
  b.querySelector('small').textContent = x.sub || '';
  b.addEventListener('click', () => {
    b.classList.add('hit');
    setTimeout(() => b.classList.remove('hit'), 180);
    onClick();
  });
  return b;
}

for (const g of GROUPS) {
  const sec = document.createElement('section');
  sec.className = 'card';
  sec.style.setProperty('--c', g.c);
  sec.innerHTML = `<h2><span class="dot"></span><span></span> <small></small></h2><div class="grid"></div>`;
  sec.querySelector('h2 span:nth-child(2)').textContent = g.title;
  sec.querySelector('h2 small').textContent = g.sub;
  const grid = sec.querySelector('.grid');
  for (const x of g.items) grid.appendChild(button({ ...x, c: g.c }, () => fire({ ...x, c: g.c })));
  $('#groups').appendChild(sec);
}

function fire(x) {
  audio.play(x.name, x.params);
  const bz = buzzFor(x);
  if (bz) audio.buzz(bz);
  showScope(x);
}

/* ---------- 장면: 게임 속 순서 ---------- */
// 장면 = [ms, 소리 이름, 인자, 진동] 목록 + 읽을 문장. 실제로 울릴 수도, 오프라인으로 그릴 수도 있다.
const at = (ms, fn) => setTimeout(fn, ms);
const say = (t, prio = 'normal') => { if ($('#tVoice').checked) voice.say(t, { prio }); };
/** from칸째부터 n칸 뛰기(말 설계의 뛰기 가속 260/260/230/210/200ms). [이벤트, 끝 ms] */
function hops(n, from = 0, start = 0) {
  const gaps = [260, 260, 230, 210, 200], ev = [];
  let ms = start;
  for (let k = 0; k < n; k++) { ev.push([ms, 'hop', { step: from + k }]); ms += gaps[Math.min(k, 4)]; }
  return [ev, ms];
}
const scene = (label, sub, build) => { const { ev, lines = [], secs = 3 } = build(); return { key: 'scene:' + label, label, sub, ev, lines, secs, c: 'var(--red)' }; };
const SCENES = [
  scene('던지기 → 모!', '가락 3개, 드르륵, 모', () => ({ secs: 3.5, ev: [
    [0, 'throwStart'], [380, 'stickLand', { vol: 0.9, pan: -0.5 }], [450, 'stickLand', { vol: 0.7, pan: 0.1 }],
    [530, 'stickLand', { vol: 0.8, pan: 0.5 }], [560, 'drumroll', { ms: 620 }], [1200, 'stickLand', { vol: 1 }, 'land'],
    [1320, 'result', { r: 5 }, 'yutmo'], [1900, 'cry', { species: 'horse' }]],
  lines: [[1500, '모다! 다섯 칸, 한 번 더!', 'high']] })),
  scene('한 칸씩 10칸', '5음계 계단 두 옥타브', () => { const [ev, end] = hops(10); ev.push([end, 'land', {}, 'land']); return { ev, secs: 3 }; }),
  scene('잡기!', '세 칸 가서 잡음 · 울음 vol 0.6', () => { const [ev, end] = hops(3); ev.push([end, 'capture', {}, 'capture'], [end, 'cry', { species: 'tiger', vol: 0.6 }]);
    return { ev, lines: [[end + 150, '잡았다! 한 번 더 던져요', 'high']] }; }),
  scene('업기', '두 칸 가서 업음', () => { const [ev, end] = hops(2); ev.push([end, 'stack', {}, 'stack']); return { ev, lines: [[end + 200, '업었다! 두동무니']] }; }),
  scene('지름길', '모 자리에서 꺾기', () => { const [ev, end] = hops(2); ev.push([end, 'shortcut']); return { ev, lines: [[end + 300, '지름길로 가요!']] }; }),
  scene('완주', '참먹이를 지나 밖으로', () => { const [ev, end] = hops(3); ev.push([end, 'finish', {}, 'finish']); return { ev, lines: [[end + 250, '완주!']] }; }),
  scene('우승 잔치', '팀 완주 → 우승 → 박수', () => ({ secs: 5.8, ev: [
    [0, 'teamDone', {}, 'finish'], [1300, 'win', {}, 'win'], [1900, 'clap'], [2600, 'cry', { species: 'horse', pitch: 1.1 }]],

  rows.push([`폰 쿵 착지 ${f(L('bigLand', 'phone'))} ≥ 한 칸 + 2`, L('bigLand', 'phone') >= hop('phone') + 2]);
  const box = $('#checks');
  box.textContent = '';
  let bad = 0;
  for (const [text, pass] of rows) {
    const s = document.createElement('span');
    s.className = pass ? 'ok' : 'bad';
    s.textContent = (pass ? '✓ ' : '✗ ') + text;
    box.appendChild(s);
    if (!pass) bad++;
  }
  return bad;
}
async function gallery() {
  const box = $('#gallery');
  box.textContent = '';
  const items = [...ALL, { key: 'music', label: '굿거리 장단', sub: '72bpm · 8초', music: true, c: 'var(--plum)' },
    { key: 'music:tense', label: '막판 긴장', sub: '90bpm · 8초', music: true, tense: true, c: 'var(--plum)' }];
  const stats = {}, lu = {};
  let bad = 0;
  for (const x of items) {
    const secs = secsOf(x);
    const buf = await renderOffline(x, secs);
    const all = measure(buf, 0, secs), tail = measure(buf, secs - 0.25, secs);
    const okPeak = all.peak > 0.01 && all.peak <= 1, okTail = x.music || tail.rms < 0.01;
    if (!okPeak || !okTail) bad++;
    lu[x.key] = { full: loudness(buf), phone: loudness(buf, true) };
    stats[x.key] = [+all.peak.toFixed(3), +all.rms.toFixed(4), +audibleLen(buf).toFixed(2), +tail.rms.toFixed(4), +lu[x.key].full.toFixed(1), +lu[x.key].phone.toFixed(1)];
    const el = document.createElement('div');
    el.className = 'wave';
    el.innerHTML = `<div class="t"><b></b><span></span></div><canvas></canvas><div class="m"></div>`;
    el.querySelector('.t b').textContent = x.label;
    el.querySelector('.t span').textContent = x.key;
    el.querySelector('.m').innerHTML = `최대 <span class="${okPeak ? 'ok' : 'bad'}">${all.peak.toFixed(2)}</span> · ${audibleLen(buf).toFixed(2)}초 · 끝 <span class="${okTail ? 'ok' : 'bad'}">${x.music ? '—' : okTail ? '✓' : tail.rms.toFixed(3)}</span><br>LUFS ${lu[x.key].full.toFixed(1)} · 폰 ${lu[x.key].phone.toFixed(1)}`;
    box.appendChild(el);
    drawWave(el.querySelector('canvas'), buf, css((x.c || 'var(--red)').replace(/var\((.*)\)/, '$1')));
  }
  bad += showChecks(lu);
  $('#galleryNote').textContent = `${items.length}개 · ${bad ? '문제 ' + bad + '개' : '모두 기준 통과'}`;
  $('#stats').textContent = JSON.stringify(stats);
  return bad;
}
$('#galleryBtn').onclick = () => gallery();

/* ---------- 시작 ---------- */
showState();
await voice.ready;
listVoices();
const show = q.get('show');
if (show) {
  const x = show === 'music' ? { key: 'music', label: '굿거리 장단', music: true } : show === 'tense' ? { key: 'music:tense', label: '막판 긴장', music: true, tense: true }
    : show.startsWith('scene') ? SCENES[+show.split(':')[1] || 0] : ALL.find(v => v.key === show);
  if (x) await showScope(x);
}
if (q.get('gallery')) await gallery();
// ?live=1: 진짜 AudioContext로 잠금 풀기 → 장단(3초 뒤 긴장) → 장면 → 끄기를 이어서 돌려 보고, 출력 크기를 50ms마다 잰다.
// 헤드리스: --autoplay-policy=no-user-gesture-required --mute-audio 로 띄우고 실제 시간으로 기다려야 한다(가상 시간에서는 오디오 시계가 멈춤)
if (q.get('live')) {
  const nap = ms => new Promise(r => setTimeout(r, ms));
  if (!q.get('voice')) { voice.setEnabled(false); listVoices(); }   // 헤드리스에서 스피커로 말하지 않게
  // 마스터 리미터(WaveShaper)가 스피커에 이어질 때 분석기도 함께 달아 둔다(개발 페이지 전용)
  const orig = AudioNode.prototype.connect;
  let an = null;
  AudioNode.prototype.connect = function (dest, ...rest) {
    const r = orig.call(this, dest, ...rest);
    if (!an && dest instanceof AudioDestinationNode && this instanceof WaveShaperNode) { an = this.context.createAnalyser(); an.fftSize = 2048; orig.call(this, an); }
    return r;
  };
  audio.unlock();
  AudioNode.prototype.connect = orig;
  const levels = [], tbuf = new Float32Array(2048), t0 = performance.now();
  let peak = 0;
  const meter = setInterval(() => {
    if (!an) return;
    an.getFloatTimeDomainData(tbuf);
    let sum = 0;
    for (const v of tbuf) { sum += v * v; peak = Math.max(peak, Math.abs(v)); }
    levels.push([(performance.now() - t0) / 1000, Math.sqrt(sum / tbuf.length)]);
  }, 50);
  const span = (a, b) => levels.filter(([t]) => t >= a && t < b).map(([, v]) => v);
  audio.music(true);
  await nap(3000);
  audio.setTension(true);
  await nap(3000);
  const tMusic = (performance.now() - t0) / 1000;
  runScene(SCENES[0]);
  await nap(3500);
  audio.music(false);
  const tOff = (performance.now() - t0) / 1000;
  await nap(1500);
  clearInterval(meter);
  // 음악만 나올 때 0.5초 창마다 가장 작은 크기(끊김 찾기), 끈 뒤 1초 지나서의 최대
  const wins = [];
  for (let a = 0.5; a + 0.5 <= tMusic; a += 0.25) wins.push(Math.max(...span(a, a + 0.5)));
  const gap = Math.min(...wins), after = Math.max(0, ...span(tOff + 1, tOff + 1.5));
  const c = audio.context;
  window.__live = { levels, gap, after, peak };
  document.title = `LIVE ${c ? c.state : 'none'} t=${c ? c.currentTime.toFixed(1) : 0} gap=${gap.toFixed(4)} off=${after.toFixed(4)} peak=${peak.toFixed(3)}`;
  syncMusic();
  showState();
} else document.title = 'READY';
</script>
